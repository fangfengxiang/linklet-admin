schema: spec-driven
context: |
  Project: linklet-admin — React management console for the Linklet short-link platform.
  Tech stack: React 19 + TypeScript + Ant Design Pro v6 + Ant Design 6 + ProComponents (ProTable/ProForm) + Umi Max 4. Independent API client connects to Linklet Admin API.
  Backend: linklet (separate repo, OpenResty/Lua). DB: PostgreSQL. Admin API under /api/v1/admin/* and /api/v1/shorten/*.
  Auth model (target): BFF proxy — Node/Umi middleware holds HttpOnly session cookie,
    signs backend requests with AK/SK server-side. SK never reaches the browser.
  Domain model (7 tables): DomainEntry, Scene, SceneConfig, Tenant, TenantCredential,
    ShortLink, IDSequence. Three bounded contexts: platform-resource, tenant-auth, short-link.
  Login/session is OUT OF SCOPE for this change (deferred to a follow-up change).
  Unified backend response: { code: 0|<errorCode>, message: string, data: object|null }.
rules:
  proposal:
    - State the relationship to the backend linklet repo and the deferred auth/session change.
  specs:
    - Use Given/When/Then format with RFC 2119 keywords (SHALL/MUST/SHOULD/MAY).
    - Reflect domain invariants (immutable target_url, non-reusable code, irreversible disable, DomainEntry offline guard, AK/SK lifecycle).
  design:
    - Justify the BFF proxy decision against the backend AK/SK constraint.
    - Map each backend admin route to a frontend API client method.
