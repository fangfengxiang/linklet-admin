name: CI

# push/PR: lint (eslint + tsc) + 生产构建（默认 + gh-pages 子路径）
# Adapted from the project's GitHub Actions conventions: checkout@v4, node cache, concurrency.
on:
  push:
    branches: [main, master, feature-*]
  pull_request:
    branches: [main, master]

concurrency:
  # 同分支 push 与 PR 复用一组；新提交取消进行中的旧运行
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint + tsc)
        run: npm run lint

      - name: Build (default, mock mode)
        run: npm run build

      - name: Build (gh-pages deploy mode)
        run: DEPLOY_BASE=gh-pages npm run build

      - name: Upload gh-pages build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-gh-pages
          path: dist
          retention-days: 7
