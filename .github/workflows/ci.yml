name: CI

# push/PR: lint (eslint + tsc) + 生产构建 + Vitest 组件测试
# E2E 测试见 e2e.yml（独立 workflow，需浏览器，较慢）
# Adapted from the project's GitHub Actions conventions: checkout@v4, node cache, concurrency.
on:
  push:
    branches: [main, master, feature-*, "codex/**"]
  pull_request:
    branches: [main, master]

concurrency:
  # 同分支 push 与 PR 复用一组；新提交取消进行中的旧运行
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 生成 Umi 临时类型（src/.umi）——tsc 解析 @umijs/max 的 history/request 等导出依赖此目录
      # 本地 dev/build 会生成，但 src/.umi 被 gitignore，远程 fresh checkout 需显式 setup
      - name: Generate Umi temp types (max setup)
        run: npx max setup

      - name: Lint (eslint + tsc)
        run: npm run lint && npm run test:e2e:types

      - name: Build (default, mock mode)
        run: npm run build

      - name: Build (gh-pages deploy mode)
        run: DEPLOY_BASE=gh-pages npm run build

      - name: Upload gh-pages build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-gh-pages
          path: dist
          retention-days: 7

  vitest:
    # Vitest + Testing Library 组件测试（happy-dom 环境，快、无浏览器）
    # vitest.config.ts include 同时覆盖 tests/** 和 src/** 纯单测，未来纯函数测试也走此 job
    name: Vitest (Component Tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 同 build job：生成 src/.umi 供 vite 解析 @umijs/max 运行时导出
      - name: Generate Umi temp types (max setup)
        run: npx max setup

      - name: Run Vitest
        run: npm run test

      - name: Test server-side signing proxy
        run: npm run test:bff
